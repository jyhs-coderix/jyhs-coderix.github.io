name: 프로젝트 작성
description: 동아리 프로젝트와 결과물을 홈페이지 프로젝트로 작성합니다.
title: "[프로젝트] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub 저장소가 없어도 괜찮습니다. 만든 것과 관련 링크를 편하게 적으면 운영진이 홈페이지 프로젝트 초안으로 정리합니다.
  - type: input
    id: title
    attributes:
      label: 제목
      placeholder: 급식 알림 봇
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 요약
      description: 한 문장으로 짧게 적어주세요. 잘 모르겠으면 본문 첫 문장을 적어도 됩니다.
      placeholder: 학교 급식 정보를 알려주는 Discord 봇입니다.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 날짜
      description: "활동하거나 글을 쓴 날짜를 적어주세요. 예: 2026-05-15"
      placeholder: 2026-05-15
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: 작성자
      description: 여러 명이면 쉼표로 구분하세요.
      placeholder: 홍길동, 김철수
    validations:
      required: true
  - type: checkboxes
    id: recommended-tags
    attributes:
      label: 추천 태그
      options:
        - label: 월간기록 (monthly)
        - label: 스터디 (study)
        - label: 프로젝트 (project)
        - label: 행사 (event)
        - label: 회고 (retrospective)
        - label: Python (python)
        - label: JavaScript (javascript)
        - label: HTML/CSS (html-css)
        - label: React (react)
        - label: 아두이노 (arduino)
        - label: AI (ai)
        - label: 웹 (web)
        - label: 앱 (app)
        - label: 게임 (game)
  - type: textarea
    id: project-links
    attributes:
      label: 프로젝트 링크
      description: 최대 5개입니다. `라벨 - URL` 형식으로 한 줄에 하나씩 적어주세요.
      placeholder: |
        GitHub - https://github.com/jyhs-coderix/example
        시연 - https://example.com
        발표 자료 - https://docs.google.com/...
  - type: textarea
    id: body
    attributes:
      label: 본문
      description: 어떤 프로젝트인지, 주요 기능, 사용 기술, 제작 과정이나 배운 점을 편하게 적어주세요.
      placeholder: |
        이 프로젝트는 ...

        주요 기능은 ...

        만들면서 배운 점은 ...
    validations:
      required: true
  - type: textarea
    id: images
    attributes:
      label: 이미지 첨부
      description: 사진을 이 칸에 끌어다 놓거나 붙여넣으세요. 운영진이 게시 전 확인합니다.
  - type: checkboxes
    id: public-check
    attributes:
      label: 공개 확인
      options:
        - label: 개인정보 없음 확인 (privacy)
          required: true
        - label: 사진 공개 동의 확인 (photo)
          required: true
        - label: 홈페이지 공개 가능 확인 (publish)
          required: true
