name: 활동 기록 작성
description: 동아리 활동, 스터디, 행사, 회고를 홈페이지 글로 작성합니다.
title: "[활동 기록] "
body:
  - type: markdown
    attributes:
      value: |
        완성된 글처럼 쓰지 않아도 됩니다. 활동 내용을 편하게 적으면 운영진이 홈페이지 글 초안으로 정리합니다.
  - type: input
    id: title
    attributes:
      label: 제목
      placeholder: 2026년 5월 활동 기록
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 요약
      description: 한 문장으로 짧게 적어주세요. 잘 모르겠으면 본문 첫 문장을 적어도 됩니다.
      placeholder: coderix의 2026년 5월 활동을 정리했습니다.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 날짜
      description: "활동하거나 글을 쓴 날짜를 적어주세요. 예: 2026-05-31"
      placeholder: 2026-05-31
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: 작성자
      description: 여러 명이면 쉼표로 구분하세요.
      placeholder: 홍길동, 김철수
    validations:
      required: true
  - type: checkboxes
    id: recommended-tags
    attributes:
      label: 추천 태그
      options:
        - label: 월간기록 (monthly)
        - label: 스터디 (study)
        - label: 프로젝트 (project)
        - label: 행사 (event)
        - label: 회고 (retrospective)
        - label: Python (python)
        - label: JavaScript (javascript)
        - label: HTML/CSS (html-css)
        - label: React (react)
        - label: 아두이노 (arduino)
        - label: AI (ai)
        - label: 웹 (web)
        - label: 앱 (app)
        - label: 게임 (game)
  - type: textarea
    id: body
    attributes:
      label: 본문
      description: 무엇을 했는지, 무엇을 만들었는지, 배운 점이나 기억할 점을 편하게 적어주세요.
      placeholder: |
        이번 활동에서는 ...

        기억에 남는 점은 ...

        다음에는 ...
    validations:
      required: true
  - type: textarea
    id: images
    attributes:
      label: 이미지 첨부
      description: 사진을 이 칸에 끌어다 놓거나 붙여넣으세요. 운영진이 게시 전 확인합니다.
  - type: checkboxes
    id: public-check
    attributes:
      label: 공개 확인
      options:
        - label: 개인정보 없음 확인 (privacy)
          required: true
        - label: 사진 공개 동의 확인 (photo)
          required: true
        - label: 홈페이지 공개 가능 확인 (publish)
          required: true
